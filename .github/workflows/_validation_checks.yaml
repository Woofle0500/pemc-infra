name: Validation checks
on:
  workflow_call:
    inputs:
      stack:
        type: string
        required: true

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.9"

      - name: Check terraform formatting
        run: terraform fmt -check -recursive -diff ${{ inputs.stack }}

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.9"

      - name: Check terraform formatting
        run: |
          cd ${{ inputs.stack }};
          terraform init -backend=false;
          terraform validate
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # needed to upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Trivy config scan (Blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with: 
            scan-type: 'config'
            severity: 'CRITICAL,HIGH'
            exit-code: '1'
            format: 'table'
            trivyignores: '.trivyignore.yaml'
            scan-ref: ${{ inputs.stack }}

      - name: Trivy config scan (generate report)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-results.sarif'
          scan-ref: ${{ inputs.stack }}

      - name: Upload to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: 'trivy-results.sarif'