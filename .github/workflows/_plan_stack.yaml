name: Plan stack
on:
  workflow_call:
    inputs:
      stack:
        type: string
        required: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute stack slug
        id: slug
        env:
          STACK: ${{ inputs.stack }}
        run: |
          slug=$(echo "${STACK#live/}" | tr '/' '-')
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      # Sandbox credentials: used by the AWS provider to read/plan the
      # actual workload resources this stack manages. Read-only by design
      # (see live/sandbox/_bootstrap/main.tf) - this role never modifies
      # state.
      - name: Configure AWS credentials (sandbox pemc-plan)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::782747473473:role/pemc-plan
          aws-region: ap-south-1

      # The S3 backend needs its own web-identity token to assume the
      # management account's plan role - it doesn't reuse the sandbox
      # credentials above (different account, different role, and the
      # backend authenticates itself independently of the AWS provider).
      - name: Fetch GitHub OIDC token for the state backend
        id: oidc-token
        run: |
          token_file="$RUNNER_TEMP/management-plan-oidc-token.jwt"
          curl -sf -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value' > "$token_file"
          echo "token-file=$token_file" >> "$GITHUB_OUTPUT"

      # assume_role_with_web_identity is an object-typed backend attribute,
      # not a flat key - `-backend-config="role_arn=..."` can't set it, so
      # we hand Terraform a partial backend config file instead (still the
      # `-backend-config` flag, just pointed at a file rather than a
      # key=value pair).
      - name: Write backend config for the management state role
        id: backend-config
        env:
          TOKEN_FILE: ${{ steps.oidc-token.outputs.token-file }}
        run: |
          backend_config_file="$RUNNER_TEMP/backend.hcl"
          cat > "$backend_config_file" <<EOF
          assume_role_with_web_identity = {
            role_arn = "arn:aws:iam::730335219774:role/pemc-management-plan"
            web_identity_token_file = "$TOKEN_FILE"
          }
          EOF
          echo "file=$backend_config_file" >> "$GITHUB_OUTPUT"

      - name: Terraform init / plan
        working-directory: ${{ inputs.stack }}
        env:
          BACKEND_CONFIG: ${{ steps.backend-config.outputs.file }}
        run: |
          terraform init -backend-config="$BACKEND_CONFIG" -input=false > /dev/null
          terraform plan -out=tfplan -input=false -lock=true > /dev/null
          terraform show tfplan > plan.txt
          terraform show -json tfplan > plan.json

      - name: Summarize plan
        working-directory: ${{ inputs.stack }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          state_serial=$(jq -r '.prior_state.serial // empty' plan.json)

          python3 "$GITHUB_WORKSPACE/tools/summarize_plan/summarize_plan.py" \
            plan.json \
            --summary-json summary.json \
            --comment-body comment.md \
            --metadata-json metadata.json \
            --head-sha "$HEAD_SHA" \
            --merge-sha "$MERGE_SHA" \
            --pr-number "$PR_NUMBER" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --state-serial "$state_serial"

      # From here on we no longer need sandbox access - swap to the
      # management plan role to upload the run's artifacts.
      - name: Configure AWS credentials (management pemc-management-plan)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::730335219774:role/pemc-management-plan
          aws-region: ap-south-1

      # Everything except the PR comment fragment goes to the run bucket.
      # `latest/` is overwritten every run so downstream tooling (and the
      # apply workflow) always has a cheap way to read the current summary
      # for a stack without needing the run id.
      - name: Upload plan artifacts to the Terraform run bucket
        working-directory: ${{ inputs.stack }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STACK_SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          run_prefix="plans/pr-${PR_NUMBER}/runs/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${STACK_SLUG}"
          latest_prefix="plans/pr-${PR_NUMBER}/latest/${STACK_SLUG}"

          for f in plan.txt tfplan summary.json metadata.json; do
            aws s3 cp "$f" "s3://woofle-pemc-tf-run/${run_prefix}/${f}" \
              --sse aws:kms --sse-kms-key-id alias/woofle-pemc-s3-shared
          done

          aws s3 cp summary.json "s3://woofle-pemc-tf-run/${latest_prefix}/summary.json" \
            --sse aws:kms --sse-kms-key-id alias/woofle-pemc-s3-shared

      # The comment fragment stayys out of S3 and is handed to the
      # post-pr-comment job as a workflow artifact instead - it's assembled
      # into one PR comment across all stacks, which S3 has no part in.
      - name: Upload PR comment fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plan-comment-${{ steps.slug.outputs.slug }}
          path: ${{ inputs.stack }}/comment.md
          retention-days: 1
