name: Validation
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "live/**"
      - ".github/workflows/**"
      - "modules/**"
      - "tools/**"
  schedule:
    - cron: "0 0 * * 0" # every Sunday at 00:00 UTC

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # TEMPORARY: research only, remove before merging.
  print-jwt:
    name: Print OIDC JWT (temporary)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Print OIDC JWT
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::No OIDC token available (id-token: write missing, or PR from a fork)."
            exit 1
          fi

          TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)

          # The runner masks the full token in logs, so print each segment on its own line.
          IFS='.' read -r HEADER PAYLOAD SIGNATURE <<< "$TOKEN"
          echo "header:    $HEADER"
          echo "payload:   $PAYLOAD"
          echo "signature: $SIGNATURE"

          # Decoded (base64url -> base64, restore padding)
          decode() {
            local s="$1"
            s=$(echo -n "$s" | tr '_-' '/+')
            while [ $(( ${#s} % 4 )) -ne 0 ]; do s="${s}="; done
            echo -n "$s" | base64 -d | jq .
          }
          echo "--- decoded header ---";  decode "$HEADER"
          echo "--- decoded payload ---"; decode "$PAYLOAD"

  discover-stacks:
    name: Discover stacks
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      stacks: ${{ steps.find.outputs.stacks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find stack directories
        id: find
        run: |
          stacks=$(find live modules -type f -name '*.tf' -exec dirname {} \; | sort -u | jq -R -s -c 'split("\n")[:-1]')

          if [ "$stacks" = "[]" ]; then
            echo "::error::No Terraform stacks found under live/ (no directories contain .tf files)."
            exit 1
          fi

          echo "stacks=$stacks" >> "$GITHUB_OUTPUT"

  no-credentials:
    name: No credentials present
    runs-on: ubuntu-latest
    if: false
    timeout-minutes: 5
    steps:
      - name: Fail if AWS credentials are present on the runner
        run: |
          if aws sts get-caller-identity >/dev/null 2>&1; then
            echo "::error::AWS credentials are configured on this runner; this workflow must run with no cloud credentials present."
            exit 1
          fi
          echo "No AWS credentials configured, as expected."

  validate:
    name: Validate (${{ matrix.stack }})
    needs: [discover-stacks, no-credentials]
    if: false
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.discover-stacks.outputs.stacks) }}
    uses: ./.github/workflows/_validation_checks.yaml
    with:
      stack: ${{ matrix.stack }}
    permissions:
      contents: read
      security-events: write
      
  tool-tests:
    name: Tool tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .tool-versions
      - run: pip install -r requirements-python.txt
      - run: pytest tools/ -v

  validation-gate:
    name: Validation
    runs-on: ubuntu-latest
    needs: [validate, tool-tests]
    if: false
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.validate.result }}" != "success" ]; then
            echo "One or more stacks failed validation"
            exit 1
          fi
      - name: Check tool test result
        run: |
          if [ "${{ needs.tool-tests.result }}" != "success" ]; then
            echo "Tool(s) failed the tests"
            exit 1
          fi
