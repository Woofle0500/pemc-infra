name: Apply stack

on:
  workflow_call:
    inputs:
      stack:
        type: string
        required: true
      pr_number:
        type: string
        required: true
    outputs:
      plan_digest:
        value: ${{ jobs.plan.outputs.plan_digest }}
      plan_key:
        value: ${{ jobs.plan.outputs.plan_key }}
      has_changes:
        value: ${{ jobs.plan.outputs.has_changes }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: sandbox-plan
    permissions:
      id-token: write
      contents: read
    outputs:
      plan_digest: ${{ steps.digest-key.outputs.plan_digest }}
      plan_key: ${{ steps.digest-key.outputs.plan_key }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute stack slug
        id: slug
        env:
          STACK: ${{ inputs.stack }}
        run: |
          slug=$(echo "${STACK#live/}" | tr '/' '-')
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: Configure AWS credentials (sandbox pemc-plan)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::782747473473:role/pemc-plan
          aws-region: ap-south-1

      # The S3 backend needs its own web-identity token to assume the
      # management account's plan role - it doesn't reuse the sandbox
      # credentials above (different account, different role, and the
      # backend authenticates itself independently of the AWS provider).
      - name: Fetch GitHub OIDC token for the state backend
        id: oidc-token
        run: |
          token_file="$RUNNER_TEMP/management-plan-oidc-token.jwt"
          curl -sf -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value' > "$token_file"
          echo "token-file=$token_file" >> "$GITHUB_OUTPUT"

      # The saved plan embeds the backend config, and apply replays it,
      # so the backend config only names a profile (pemc-state). The
      # profile itself, and the role it assumes, is defined per job in
      # an AWS config file.
      - name: Write backend config for the management state role
        id: backend-config
        env:
          TOKEN_FILE: ${{ steps.oidc-token.outputs.token-file }}
        run: |
          backend_config_file="$RUNNER_TEMP/backend.hcl"
          aws_config_file="$RUNNER_TEMP/aws-config"
          cat > "$aws_config_file" <<EOF
          [profile pemc-state]
          role_arn = arn:aws:iam::730335219774:role/pemc-management-plan
          web_identity_token_file = $TOKEN_FILE
          region = ap-south-1
          EOF
          cat > "$backend_config_file" <<EOF
          profile = "pemc-state"
          EOF
          echo "AWS_CONFIG_FILE=$aws_config_file" >> "$GITHUB_ENV"
          echo "file=$backend_config_file" >> "$GITHUB_OUTPUT"

      - name: Terraform init / plan
        id: plan
        working-directory: ${{ inputs.stack }}
        env:
          BACKEND_CONFIG: ${{ steps.backend-config.outputs.file }}
        run: |
          terraform init -backend-config="$BACKEND_CONFIG" -input=false > /dev/null

          echo "Pulling terraform state serial..."
          raw_state=$(terraform state pull)
          if [ -z "$raw_state" ]; then state_serial=0; else state_serial=$(jq -r '.serial' <<<"$raw_state"); fi
          unset raw_state
          echo "STATE_SERIAL=$state_serial" >> "$GITHUB_ENV"

          echo "Building terraform plan..."
          # -detailed-exitcode: 0 = no changes, 2 = changes, 1 = error.
          set +e
          terraform plan -detailed-exitcode -out=tfplan -input=false -lock=true -lock-timeout=3m > /dev/null
          rc=$?
          set -e

          case "$rc" in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "has_changes=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::terraform plan failed with exit code $rc."
              exit 1
              ;;
          esac

      - name: Terraform show
        working-directory: ${{ inputs.stack }}
        run: |
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan > plan.json

      - name: Summarize plan
        working-directory: ${{ inputs.stack }}
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ github.sha }}
          MERGE_SHA: ${{ github.sha }}
          STACK_SLUG: ${{ steps.slug.outputs.slug }}
          PLAN_URI: s3://woofle-pemc-tf-run/plans/main/${{ github.sha }}/${{ github.run_id }}/${{ github.run_attempt }}/${{ steps.slug.outputs.slug }}/plan.txt
        run: |
          state_serial=$STATE_SERIAL

          # comment.md is named with the stack slug baked in, not left
          # generic - it's written into $GITHUB_STEP_SUMMARY below, so a
          # generic name would collide if this ever fans out further.
          python3 "$GITHUB_WORKSPACE/tools/summarize_plan/summarize_plan.py" \
            plan.json \
            --summary-json summary.json \
            --comment-body "comment-${STACK_SLUG}.md" \
            --metadata-json metadata.json \
            --head-sha "$HEAD_SHA" \
            --merge-sha "$MERGE_SHA" \
            --pr-number "$PR_NUMBER" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --state-serial "$state_serial" \
            --plan-uri "$PLAN_URI"

      # Real policy evaluation (OPA/Conftest) lands here later.
      - name: Policy gate (placeholder)
        run: |
          echo "Policy gate: not yet implemented"
          exit 0

      # From here on we no longer need sandbox access - swap to the
      # management plan role for the S3 steps that follow (divergence
      # check download, then the artifact upload).
      - name: Configure AWS credentials (management pemc-management-plan)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::730335219774:role/pemc-management-plan
          aws-region: ap-south-1

      # Confirms the plan about to be applied still matches what a
      # reviewer actually approved on the PR. Neither failure type here
      # blocks the job - a missing/expired reviewed plan or a genuine
      # divergence is a signal for whoever approves the apply, not a
      # reason to fail the pipeline outright.
      - name: Divergence check
        id: divergence
        working-directory: ${{ inputs.stack }}
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          STACK_SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          reviewed_uri="s3://woofle-pemc-tf-run/plans/pr-${PR_NUMBER}/latest/${STACK_SLUG}/summary.json"
          reviewed_file="$RUNNER_TEMP/reviewed-summary.json"
          diff_file="$RUNNER_TEMP/divergence.txt"

          if ! out=$(aws s3 cp "$reviewed_uri" "$reviewed_file" 2>&1); then
            # Only a missing key means "unverified". Anything else
            # (e.g. 403, throttling, network) is an error, not a missing plan.
            if ! echo "$out" | grep -qE '\(404\)|NoSuchKey|does not exist'; then
              echo "::error::Could not read the reviewed summary."
              echo "$out"
              exit 1
            fi
            echo "::warning::No reviewed plan found for ${STACK_SLUG} at ${reviewed_uri} - it is missing or expired. Review this plan before approving the apply."
            echo "status=unverified" >> "$GITHUB_OUTPUT"
            {
              echo "### Divergence check: ⚠️ UNVERIFIED"
              echo
              echo "No reviewed plan found for \`${STACK_SLUG}\` from PR #${PR_NUMBER} (missing or expired). Review this plan before approving the apply."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if python3 "$GITHUB_WORKSPACE/tools/compare_summaries/compare_summaries.py" \
              --reviewed "$reviewed_file" --current summary.json 2> "$diff_file"; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
            {
              echo "### Divergence check: ✅ PASSED"
              echo
              echo "This plan matches the plan reviewed on PR #${PR_NUMBER}."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$diff_file" >&2
            echo "::warning::Plan for ${STACK_SLUG} diverges from the plan reviewed on PR #${PR_NUMBER} - review this plan before approving the apply."
            echo "status=failed" >> "$GITHUB_OUTPUT"
            {
              echo "### Divergence check: ❌ FAILED"
              echo
              echo "This plan diverges from the plan reviewed on PR #${PR_NUMBER}. Review it before approving the apply."
              echo
              echo '```'
              cat "$diff_file"
              echo '```'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compute plan digest and key
        id: digest-key
        working-directory: ${{ inputs.stack }}
        env:
          STACK_SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          key="plans/main/${GITHUB_SHA}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${STACK_SLUG}"
          echo "plan_key=$key" >> "$GITHUB_OUTPUT"
          echo "plan_digest=$(sha256sum tfplan | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload plan artifacts to the Terraform run bucket
        working-directory: ${{ inputs.stack }}
        env:
          KEY: ${{ steps.digest-key.outputs.plan_key }}
        run: |
          for f in plan.txt tfplan summary.json metadata.json; do
            aws s3 cp "$f" "s3://woofle-pemc-tf-run/${KEY}/${f}" \
              --sse aws:kms --sse-kms-key-id alias/woofle-pemc-tf-run
          done

      # The plan.txt digest lets the approver verify the file
      # they fetch from S3.
      - name: Write plan comment to job summary
        working-directory: ${{ inputs.stack }}
        env:
          STACK_SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          cat "comment-${STACK_SLUG}.md" >> "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo "plan.txt sha256: \`$(sha256sum plan.txt | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60 # change it if need be
    environment: sandbox-apply
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: apply-${{ inputs.stack }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute stack slug
        id: slug
        env:
          STACK: ${{ inputs.stack }}
        run: |
          # e.g. live/sandbox/ap-south-1/storage -> sandbox-ap-south-1-storage
          slug=$(echo "${STACK#live/}" | tr '/' '-')
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: Configure AWS credentials (management pemc-management-apply)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::730335219774:role/pemc-management-apply
          aws-region: ap-south-1

      # The S3 backend authenticates itself with its own web-identity
      # token, independent of the credentials configured above.
      - name: Fetch GitHub OIDC token for the state backend
        id: oidc-token
        run: |
          token_file="$RUNNER_TEMP/management-apply-oidc-token.jwt"
          curl -sf -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value' > "$token_file"
          echo "token-file=$token_file" >> "$GITHUB_OUTPUT"

      # The saved plan embeds the backend config it was planned with, and
      # `terraform apply tfplan` replays that. So the backend config only
      # names a profile.
      - name: Write backend config for the management state role
        id: backend-config
        env:
          TOKEN_FILE: ${{ steps.oidc-token.outputs.token-file }}
        run: |
          backend_config_file="$RUNNER_TEMP/backend.hcl"
          aws_config_file="$RUNNER_TEMP/aws-config"
          cat > "$aws_config_file" <<BACKEND
          [profile pemc-state]
          role_arn = arn:aws:iam::730335219774:role/pemc-management-apply
          web_identity_token_file = $TOKEN_FILE
          region = ap-south-1
          BACKEND
          cat > "$backend_config_file" <<BACKEND
          profile = "pemc-state"
          BACKEND
          echo "AWS_CONFIG_FILE=$aws_config_file" >> "$GITHUB_ENV"
          echo "file=$backend_config_file" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: ${{ inputs.stack }}
        env:
          BACKEND_CONFIG: ${{ steps.backend-config.outputs.file }}
        run: terraform init -backend-config="$BACKEND_CONFIG" -input=false > /dev/null

      - name: Download the reviewed plan
        working-directory: ${{ inputs.stack }}
        env:
          PLAN_KEY: ${{ needs.plan.outputs.plan_key }}
        run: aws s3 cp "s3://woofle-pemc-tf-run/${PLAN_KEY}/tfplan" tfplan

      - name: Verify plan digest
        working-directory: ${{ inputs.stack }}
        env:
          EXPECTED_DIGEST: ${{ needs.plan.outputs.plan_digest }}
        run: |
          actual=$(sha256sum tfplan | cut -d' ' -f1)
          if [ "$actual" != "$EXPECTED_DIGEST" ]; then
            echo "::error::tfplan digest mismatch: expected $EXPECTED_DIGEST, got $actual. Refusing to apply."
            exit 1
          fi

      # From here on the provider has write access.
      - name: Configure AWS credentials (sandbox pemc-apply)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::782747473473:role/pemc-apply
          aws-region: ap-south-1

      - name: Terraform apply
        working-directory: ${{ inputs.stack }}
        run: terraform apply -no-color -input=false -lock-timeout=3m tfplan > apply.txt

      # If the state couldn't be written back to the backend, terraform
      # leaves errored.tfstate locally - without this it dies with the runner.
      - name: Check for errored state
        id: errored
        if: failure()
        working-directory: ${{ inputs.stack }}
        run: |
          if [ -f errored.tfstate ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No errored.tfstate present - nothing to rescue."
          fi

      - name: Configure AWS credentials (management pemc-management-apply, state rescue)
        if: failure() && steps.errored.outputs.present == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::730335219774:role/pemc-management-apply
          aws-region: ap-south-1

      - name: Upload errored state
        if: failure() && steps.errored.outputs.present == 'true'
        working-directory: ${{ inputs.stack }}
        env:
          PLAN_KEY: ${{ needs.plan.outputs.plan_key }}
        run: |
          dest="s3://woofle-pemc-tf-run/${PLAN_KEY}/errored.tfstate"
          aws s3 cp errored.tfstate "$dest" \
            --sse aws:kms --sse-kms-key-id alias/woofle-pemc-tf-run
          echo "::error::Terraform apply FAILED and the state could not be saved to the backend. The in-flight state was rescued to ${dest} - recover it with 'terraform state push'"

      # The pemc-state profile re-reads the token file on every terraform
      # command, and the OIDC token only lives ~300s. The apply may have
      # outlived the token fetched earlier, so refresh the same file.
      - name: Refresh GitHub OIDC token for the state backend
        env:
          TOKEN_FILE: ${{ steps.oidc-token.outputs.token-file }}
        run: |
          curl -sf -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value' > "$TOKEN_FILE"

      - name: Check convergence
        id: converge
        working-directory: ${{ inputs.stack }}
        run: |
          set +e
          terraform plan -detailed-exitcode -input=false -lock-timeout=3m > /dev/null
          rc=$?
          set -e

          case "$rc" in
            0)
              echo "converged=true" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "converged=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Stack ${STACK} did not converge: a plan right after apply still shows changes. The world already differs from what was just applied."
              ;;
            *)
              echo "::error::Post-apply convergence plan failed with exit code $rc."
              exit 1
              ;;
          esac
        env:
          STACK: ${{ inputs.stack }}

      # Runs even when apply failed, so a partial apply log is still kept.
      - name: Check for apply output
        id: apply-output
        if: always()
        working-directory: ${{ inputs.stack }}
        run: |
          if [ -f apply.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No apply.txt present - nothing to upload."
          fi

      - name: Configure AWS credentials (management pemc-management-apply, upload)
        if: always() && steps.apply-output.outputs.present == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::730335219774:role/pemc-management-apply
          aws-region: ap-south-1

      - name: Upload apply output
        if: always() && steps.apply-output.outputs.present == 'true'
        working-directory: ${{ inputs.stack }}
        env:
          PLAN_KEY: ${{ needs.plan.outputs.plan_key }}
        run: |
          aws s3 cp apply.txt "s3://woofle-pemc-tf-run/${PLAN_KEY}/apply.txt" \
            --sse aws:kms --sse-kms-key-id alias/woofle-pemc-tf-run

      - name: Write apply result to job summary
        env:
          CONVERGED: ${{ steps.converge.outputs.converged }}
          PLAN_KEY: ${{ needs.plan.outputs.plan_key }}
        run: |
          {
            if [ "$CONVERGED" = "false" ]; then
              echo "> ⚠️ **Warning:** the post-apply plan still shows changes - the world already differs from what was just applied."
              echo
            fi
            echo "### Apply output"
            echo
            echo "Full output: \`s3://woofle-pemc-tf-run/${PLAN_KEY}/apply.txt\`"
            echo "\`aws s3 cp s3://woofle-pemc-tf-run/${PLAN_KEY}/apply.txt - --profile management\`"
          } >> "$GITHUB_STEP_SUMMARY"
